<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff8e0"/>
      <stop offset="100%" stop-color="#fdebe6"/>
    </linearGradient>
    <linearGradient id="fire" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fcd222"/>
      <stop offset="100%" stop-color="#e23000"/>
    </linearGradient>
  </defs>
  <rect width="320" height="200" fill="url(#bg)"/>
  <!-- Smoke clouds at top -->
  <circle cx="80" cy="34" r="30" fill="#8a99ab" opacity="0.22"/>
  <circle cx="122" cy="28" r="36" fill="#8a99ab" opacity="0.18"/>
  <circle cx="170" cy="36" r="28" fill="#8a99ab" opacity="0.15"/>
  <!-- Flame -->
  <path d="M 86 164 C 52 164 46 126 66 102 C 68 114 78 116 80 100 C 86 78 108 70 106 54 C 128 74 134 106 124 134 C 118 152 104 164 86 164 Z" fill="url(#fire)"/>
  <path d="M 88 164 C 72 164 70 142 84 128 C 92 140 102 138 100 122 C 112 134 110 164 88 164 Z" fill="#fcd222"/>
  <!-- Safe low arrow toward green exit -->
  <path d="M 142 144 H 204 M 192 130 L 208 144 L 192 158" fill="none" stroke="#0080ff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Green emergency exit door -->
  <rect x="224" y="64" width="66" height="102" rx="12" fill="#00d656"/>
  <rect x="234" y="76" width="46" height="90" rx="8" fill="#ffffff" opacity="0.25"/>
  <circle cx="272" cy="122" r="5" fill="#ffffff"/>
</svg>
