<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fdebe6"/>
      <stop offset="100%" stop-color="#fff6f2"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e23000"/>
      <stop offset="100%" stop-color="#ff5a2c"/>
    </linearGradient>
  </defs>
  <rect width="320" height="200" fill="url(#bg)"/>
  <circle cx="265" cy="45" r="70" fill="#fcd222" opacity="0.22"/>
  <circle cx="55" cy="175" r="55" fill="#0080ff" opacity="0.10"/>
  <!-- Seismic wave arcs -->
  <path d="M 30 160 Q 70 135 110 160 T 190 160 T 270 160 T 320 155" fill="none" stroke="#e23000" stroke-width="5" stroke-linecap="round" opacity="0.28"/>
  <path d="M 15 174 Q 65 152 115 174 T 215 174 T 315 170" fill="none" stroke="#e23000" stroke-width="3.5" stroke-linecap="round" opacity="0.18"/>
  <!-- Sturdy desk -->
  <rect x="82" y="88" width="156" height="14" rx="7" fill="#0080ff"/>
  <rect x="94" y="102" width="12" height="58" rx="6" fill="#0066cc"/>
  <rect x="214" y="102" width="12" height="58" rx="6" fill="#0066cc"/>
  <!-- Person taking safe cover under desk -->
  <circle cx="152" cy="120" r="13" fill="#0b2a4a"/>
  <path d="M 134 148 C 134 132 164 130 176 142 L 184 156 L 136 156 Z" fill="#0080ff"/>
  <path d="M 150 110 Q 165 106 168 122" fill="none" stroke="#fcd222" stroke-width="5" stroke-linecap="round"/>
  <!-- Shock pulse above desk -->
  <path d="M 125 66 Q 160 44 195 66" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
  <path d="M 140 50 Q 160 36 180 50" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" opacity="0.65"/>
</svg>
