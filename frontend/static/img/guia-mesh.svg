<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0080ff"/>
      <stop offset="100%" stop-color="#0057b8"/>
    </linearGradient>
  </defs>
  <rect width="420" height="180" fill="url(#bg)"/>
  <!-- Subtle concentric mesh waves -->
  <circle cx="210" cy="90" r="46" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.25"/>
  <circle cx="210" cy="90" r="78" fill="none" stroke="#00d656" stroke-width="3.5" opacity="0.45" stroke-dasharray="10 8"/>
  <circle cx="210" cy="90" r="112" fill="none" stroke="#fcd222" stroke-width="2.5" opacity="0.35"/>
  <!-- Left phone -->
  <rect x="64" y="36" width="66" height="108" rx="16" fill="#ffffff"/>
  <rect x="72" y="48" width="50" height="80" rx="8" fill="#e6f2ff"/>
  <rect x="80" y="64" width="34" height="10" rx="5" fill="#0080ff"/>
  <rect x="80" y="82" width="26" height="10" rx="5" fill="#00d656"/>
  <!-- Right phone -->
  <rect x="290" y="36" width="66" height="108" rx="16" fill="#ffffff"/>
  <rect x="298" y="48" width="50" height="80" rx="8" fill="#e6f2ff"/>
  <rect x="306" y="64" width="34" height="10" rx="5" fill="#00d656"/>
  <rect x="306" y="82" width="26" height="10" rx="5" fill="#0080ff"/>
  <!-- Center hop node -->
  <circle cx="210" cy="90" r="24" fill="#00d656"/>
  <path d="M 200 90 L 207 97 L 222 82" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Packet dots -->
  <circle cx="158" cy="90" r="6" fill="#fcd222"/>
  <circle cx="262" cy="90" r="6" fill="#fcd222"/>
</svg>
